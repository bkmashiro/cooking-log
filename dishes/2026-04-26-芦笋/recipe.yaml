  - name: { zh: 黑胡椒,     en: Black Pepper,       ja: 黒こしょう }
    scale: to_taste

  - name: { zh: 柠檬汁,     en: Lemon Juice,        ja: レモン汁 }
    amount: 0.5
    unit: { zh: 茶匙, en: " tsp", ja: 小さじ }
    scale: linear
    note: { zh: 出锅后淋, en: squeeze over at the end, ja: 仕上げに }

  - name: { zh: 蒜,         en: Garlic,             ja: ニンニク }
    amount: 2
    unit: { zh: 瓣, en: " cloves", ja: 片 }
