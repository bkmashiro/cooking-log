  - name: { zh: 姜,             en: Ginger,                  ja: 生姜 }
    amount: 1
    unit: { zh: 茶匙, en: " tsp (minced)", ja: 小さじ（みじん切り） }
    scale: linear

  - name: { zh: 小米辣,         en: Fresh Chilli,            ja: 小米辣 }
    amount: 2
    unit: { zh: 根, en: " pieces", ja: 本 }
