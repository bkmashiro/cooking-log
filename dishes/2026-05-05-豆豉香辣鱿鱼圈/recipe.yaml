dish:
  zh: 豆豉香辣鱿鱼圈
  en: Spicy Black Bean Squid Rings
  ja: 豆豉香辣イカリング

date: 2026-05-05
url_slug: 2026-05-05-spicy-black-bean-squid-rings
base_servings: 2
category: seafood
tags: [weeknight, spicy, seafood, stir-fry]

ingredients:
  - name: { zh: 鱿鱼圈,         en: Squid Rings,             ja: イカリング }
